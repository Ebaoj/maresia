<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neto · Jolt e Ammo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9dfcb;color:#30271f;font:14px system-ui}header{position:absolute;z-index:2;top:0;width:100%;padding:18px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#e9dfcbe8}h1{font-size:20px;margin:0 16px 0 0}button,select{font:inherit;padding:9px 13px;color:inherit;background:#fff6e7;border:1px solid #b5a48e;border-radius:7px;cursor:pointer}canvas{display:block}.label{position:absolute;top:88px;z-index:2;pointer-events:none;width:50%;text-align:center;font-size:22px;font-weight:700}.label small{display:block;font:12px system-ui;margin-top:5px}.right{left:50%}#line{position:absolute;left:50%;top:80px;bottom:0;border-left:1px solid #b4a48b;pointer-events:none}footer{position:absolute;bottom:12px;width:100%;text-align:center;font-size:12px;color:#75614e;pointer-events:none}#estado{position:absolute;top:160px;left:20px;right:20px;text-align:center;background:#e9dfcbe8;z-index:3}button:disabled{opacity:.5}</style>
<header><h1>Neto · comparar tecido</h1><select id="mov" aria-label="Movimento"><option value="andar">Caminhar</option><option value="correr">Correr</option><option value="olhando">Olhar em volta</option><option value="T">Pose T</option></select><button id="pause">Pausar</button><button id="perto">Camisa de perto</button><button id="inteiro">Corpo inteiro</button><button id="costas">Costas</button><button id="fisica">Física ligada</button><button id="gravar">Gravar comparação</button></header>
<div class="label">Jolt<small id="jolt-stats">Carregando…</small></div><div class="label right">Ammo / Bullet · nativo<small id="ammo-stats">Carregando…</small></div><div id="line"></div><div id="estado">Preparando os dois motores…</div><footer>Mesma animação · Ammo: camisa simulada, pele animada e calça com contato nativo · passo de 60 Hz · arraste para girar · role para aproximar</footer>
<script src="/node_modules/three/examples/jsm/libs/ammo.wasm.js"></script>
<script type="module">
import * as T from 'three';import { OrbitControls } from 'three/addons/controls/OrbitControls.js';import { carregar,ossosPorNome,carregarMovimentosMixamo } from '/src/jogador/retarget.js';import { criarTecidoJolt } from './tecido-jolt.js';import { criarTecidoAmmo } from './tecido-ammo.js';
const estado=document.querySelector('#estado');
try{
 const A=await window.Ammo({locateFile:name=>'/node_modules/three/examples/jsm/libs/'+name});
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.AgXToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
 const camera=new T.PerspectiveCamera(35,innerWidth/2/(innerHeight-150),.01,50),controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.97,0);camera.position.set(.7,1.16,2.1);controls.enableDamping=true;controls.minDistance=.55;controls.maxDistance=6;
 const worlds=[];
 for(const tipo of ['jolt','ammo']){
  const scene=new T.Scene();scene.background=new T.Color('#e9dfcb');scene.add(new T.HemisphereLight(0xfff7e8,0x756a53,2.2));const sun=new T.DirectionalLight(0xfff2da,3);sun.position.set(-3,5,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.normalBias=(sun.shadow.camera.right-sun.shadow.camera.left)/1024;scene.add(sun);const fill=new T.DirectionalLight(0xcbd8ed,1);fill.position.set(3,2,-2);scene.add(fill);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#ddd0b9',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);
  const {raiz}=await carregar('/arte/finais/neto-v6-corpo.glb?v=comparacao-superficie-13');scene.add(raiz);raiz.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}});const ossos=ossosPorNome(raiz),rest=new Map([...ossos].map(([n,b])=>[n,{p:b.position.clone(),q:b.quaternion.clone()}]));const {clipes,faltando}=await carregarMovimentosMixamo({alvo:{raiz,ossos},pasta:'/animacoes/mixamo/',nomes:['andar','correr','olhando']});if(faltando.length)throw Error('Movimento ausente: '+faltando.join(','));
  const tecido=tipo==='jolt'?await criarTecidoJolt(raiz):await criarTecidoAmmo(raiz,A);worlds.push({tipo,scene,raiz,ossos,rest,clipes,tecido,mixer:new T.AnimationMixer(raiz),ms:0,count:0});
 }
 let paused=false,active=true,elapsed=0,acc=0;function play(name){for(const w of worlds){w.mixer.stopAllAction();for(const[n,b]of w.ossos){b.position.copy(w.rest.get(n).p);b.quaternion.copy(w.rest.get(n).q);}if(w.clipes[name])w.mixer.clipAction(w.clipes[name]).play();w.mixer.update(0);w.raiz.updateMatrixWorld(true);w.tecido.reset();}acc=0;}
 play('andar');document.querySelector('#mov').value='andar';document.querySelector('#mov').onchange=e=>{estado.textContent='';play(e.target.value);};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar';};function view(position,target){controls.enableDamping=false;camera.position.set(...position);controls.target.set(...target);controls.update();}
 document.querySelector('#perto').onclick=()=>view([.5,1.18,1.14],[0,1.02,0]);document.querySelector('#inteiro').onclick=()=>view([.7,1.04,3.1],[0,.78,0]);document.querySelector('#costas').onclick=()=>view([-.45,1.18,-1.15],[0,1.02,0]);document.querySelector('#fisica').onclick=e=>{active=!active;worlds.forEach(w=>w.tecido.setActive(active));e.target.textContent=active?'Física ligada':'Física desligada';};
 document.querySelector('#gravar').onclick=async e=>{e.target.disabled=true;paused=false;document.querySelector('#pause').textContent='Pausar';const chunks=[],stream=renderer.domElement.captureStream(30),type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:5000000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const done=new Promise(r=>rec.onstop=r);rec.start(500);for(const[name,pos,target]of [['andar',[.5,1.18,1.14],[0,1.02,0]],['correr',[.5,1.18,1.14],[0,1.02,0]],['olhando',[-.45,1.18,-1.15],[0,1.02,0]]]){play(name);document.querySelector('#mov').value=name;view(pos,target);estado.textContent='Gravando '+name+'…';await new Promise(r=>setTimeout(r,6000));}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());await fetch('http://127.0.0.1:5204/capture',{method:'POST',headers:{'Content-Type':'video/webm'},body:new Blob(chunks,{type})});estado.textContent='Comparação gravada';e.target.disabled=false;};
 estado.textContent='';const clock=new T.Clock();function frame(){requestAnimationFrame(frame);const dt=clock.getDelta();if(!paused){acc=Math.min(acc+dt,2/60);while(acc>=1/60){for(const w of worlds){w.mixer.update(1/60);const start=performance.now();w.tecido.update(1/60);w.ms+=performance.now()-start;w.count++;}acc-=1/60;}}controls.update();renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);const width=innerWidth/2,height=innerHeight-150;worlds.forEach((w,i)=>{renderer.setViewport(i*width,0,width,height);renderer.setScissor(i*width,0,width,height);renderer.render(w.scene,camera);});elapsed+=dt;if(elapsed>1){for(const w of worlds){document.querySelector('#'+w.tipo+'-stats').textContent=w.tecido.stats.particles+' pontos · '+(w.ms/Math.max(1,w.count)).toFixed(2)+' ms por passo';w.ms=0;w.count=0;}elapsed=0;}}frame();window.netoComparacao={worlds,renderer,camera,play,ready:true};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/2/(innerHeight-150);camera.updateProjectionMatrix();});
}catch(error){estado.textContent='Falha ao iniciar: '+error.message;console.error(error);}
</script></html>
