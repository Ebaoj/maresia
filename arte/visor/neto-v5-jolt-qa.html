<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neto — revisão de roupa</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9dfcb;color:#30271f;font:15px system-ui}header{position:absolute;top:0;left:0;right:0;padding:22px 28px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0 0 6px;font-size:24px}p{margin:0;color:#75614e;font-size:13px}nav{display:flex;gap:8px}button,select{background:#f9f1e3;border:1px solid #b5a48e;border-radius:8px;color:inherit;padding:10px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#9e4538;color:white}canvas{display:block}footer{position:absolute;bottom:20px;left:28px;font-size:12px;color:#75614e}#estado{position:absolute;left:28px;bottom:45px;color:#70442e;font-size:13px}</style>
<header><div><h1>Neto · roupa em peças</h1><p>Arraste para girar · role para aproximar</p></div><nav><select id="mov" aria-label="Movimento"><option value="andar">Caminhar</option><option value="correr">Correr</option><option value="olhando">Olhar em volta</option><option value="T">Pose T</option></select><button id="pause" aria-pressed="false">Pausar</button><button id="volta">Frente</button><button id="gola">Gola</button><button id="maos">Mãos</button><button id="corpo">Ver corpo</button><button id="pele">Destacar corpo</button><button id="fisica">Física ligada</button><button id="gravar">Gravar revisão</button></nav></header><div id="estado">Carregando o Neto…</div><footer>Revisão de roupa · Jolt do jogo · corpo completo</footer>
<script type="module">
import { criarTecidoJolt } from './tecido-jolt.js';import * as T from 'three';import { OrbitControls } from 'three/addons/controls/OrbitControls.js';import { carregar,ossosPorNome,carregarMovimentosMixamo } from '/src/jogador/retarget.js';
const scene=new T.Scene();scene.background=new T.Color('#e9dfcb');const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,50);camera.position.set(1.5,1.05,3.1);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.AgXToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.77,0);controls.enableDamping=true;controls.minDistance=.7;controls.maxDistance=6;controls.update();
scene.add(new T.HemisphereLight(0xfff7e8,0x756a53,2.2));const sol=new T.DirectionalLight(0xfff2da,3);sol.position.set(-3,5,4);sol.castShadow=true;sol.shadow.mapSize.set(1024,1024);sol.shadow.normalBias=(sol.shadow.camera.right-sol.shadow.camera.left)/sol.shadow.mapSize.width;scene.add(sol);const fill=new T.DirectionalLight(0xcbd8ed,1);fill.position.set(3,2,-2);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#ddd0b9',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);
const {raiz}=await carregar('/arte/finais/neto-v5-jolt.glb?v=ajuste-2');scene.add(raiz);raiz.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}});const ossos=ossosPorNome(raiz);const rest=new Map([...ossos].map(([n,b])=>[n,{p:b.position.clone(),q:b.quaternion.clone()}]));
const {clipes,faltando}=await carregarMovimentosMixamo({alvo:{raiz,ossos},pasta:'/animacoes/mixamo/',nomes:['andar','correr','olhando']});if(faltando.length)throw new Error('Movimentos ausentes: '+faltando.join(','));
const tecido=await criarTecidoJolt(raiz);const mixer=new T.AnimationMixer(raiz);let paused=false;const play=nome=>{mixer.stopAllAction();for(const [n,b] of ossos){b.position.copy(rest.get(n).p);b.quaternion.copy(rest.get(n).q)}if(clipes[nome])mixer.clipAction(clipes[nome]).play();mixer.update(0);raiz.updateMatrixWorld(true);tecido.reset();tecido.update(1/60)};play('andar');
document.querySelector('#mov').onchange=e=>play(e.target.value);document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Continuar':'Pausar';e.currentTarget.setAttribute('aria-pressed',String(paused))};document.querySelector('#volta').onclick=()=>{focoMao=false;camera.position.set(0,1,3.2);controls.target.set(0,.77,0);controls.update()};document.querySelector('#estado').textContent='';
document.querySelector('#gola').onclick=()=>{focoMao=false;paused=true;const pb=document.querySelector('#pause');pb.textContent='Continuar';pb.setAttribute('aria-pressed','true');const q=ossos.get('Neck').getWorldPosition(new T.Vector3());controls.enableDamping=false;controls.target.copy(q).add(new T.Vector3(0,.015,0));camera.position.copy(controls.target).add(new T.Vector3(.55,.10,.75));controls.update()};
let focoMao=false;document.querySelector('#maos').onclick=()=>{focoMao=true;controls.enableDamping=false;controls.minDistance=.18;paused=false;document.querySelector('#pause').textContent='Pausar';document.querySelector('#pause').setAttribute('aria-pressed','false');};
let roupaVisivel=true;document.querySelector('#corpo').onclick=e=>{roupaVisivel=!roupaVisivel;for(const r of tecido.render)r.mesh.visible=roupaVisivel;e.target.textContent=roupaVisivel?'Ver corpo':'Vestir roupas'};
const bodyParts=tecido.groups.find(g=>g.name==='corpo').parts,bodyMats=bodyParts.map(p=>p.material);let destacar=false;document.querySelector('#pele').onclick=e=>{destacar=!destacar;bodyParts.forEach((p,i)=>{if(destacar){p.material=bodyMats[i].clone();p.material.map=null;p.material.color.set('#00ffff');p.material.needsUpdate=true;}else{p.material.dispose();p.material=bodyMats[i];}});e.target.textContent=destacar?'Corpo normal':'Destacar corpo'};
let fisicaAtiva=true;document.querySelector('#fisica').onclick=e=>{fisicaAtiva=!fisicaAtiva;tecido.setActive(fisicaAtiva);e.target.textContent=fisicaAtiva?'Física ligada':'Física desligada'};
document.querySelector('#gravar').onclick=async e=>{
 e.target.disabled=true;focoMao=false;paused=false;document.querySelector('#pause').textContent='Pausar';document.querySelector('#pause').setAttribute('aria-pressed','false');controls.enableDamping=false;
 const stream=renderer.domElement.captureStream(30),chunks=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:3500000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 const done=new Promise(resolve=>rec.onstop=resolve);rec.start(500);
 const sections=[['andar',[.9,1.05,3.0],[0,.78,0]],['correr',[-1.15,1.1,2.9],[0,.8,0]],['olhando',[1.1,1.15,-2.8],[0,.8,0]],['olhando',[.65,1.29,.91],[0,1.20,0]]];
 for(const [name,pos,target] of sections){document.querySelector('#mov').value=name;play(name);camera.position.set(...pos);controls.target.set(...target);controls.update();document.querySelector('#estado').textContent='Gravando '+name+'…';await new Promise(r=>setTimeout(r,3000));}
 focoMao=true;document.querySelector('#estado').textContent='Gravando dedos…';await new Promise(r=>setTimeout(r,5000));focoMao=false;
 document.querySelector('#estado').textContent='Finalizando vídeo…';rec.stop();await done;stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type});await fetch('http://127.0.0.1:5204/capture',{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});document.querySelector('#estado').textContent='Vídeo gravado';e.target.disabled=false;
};
const clock=new T.Clock();let acumulado=0;window.netoRevisao={raiz,ossos,mixer,play,renderer,camera,scene,clipes,ready:true,tecido};function frame(){requestAnimationFrame(frame);const elapsed=clock.getDelta();if(!paused){acumulado+=Math.min(elapsed,.0667);while(acumulado>=1/120){mixer.update(1/120);tecido.update(1/120);acumulado-=1/120}}else acumulado=0;if(focoMao){const wrist=ossos.get('LeftHand').getWorldPosition(new T.Vector3()),middle=ossos.get('LeftHandMiddle1').getWorldPosition(new T.Vector3()),index=ossos.get('LeftHandIndex1').getWorldPosition(new T.Vector3()),pinky=ossos.get('LeftHandPinky1').getWorldPosition(new T.Vector3());const along=middle.clone().sub(wrist).normalize(),across=pinky.clone().sub(index).normalize(),normal=new T.Vector3().crossVectors(along,across).normalize();controls.target.copy(wrist).addScaledVector(along,.075);camera.position.copy(controls.target).addScaledVector(normal,.48).addScaledVector(across,.12).addScaledVector(along,.12);}controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
