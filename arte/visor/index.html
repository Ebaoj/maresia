<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maresia: ateliê</title>
<style>
  :root { --papel:#F4EBD8; --tinta:#2B211C; --anil:#324F58; --suave:#7a6a5c; }
  * { box-sizing:border-box } body { margin:0; background:var(--papel); color:var(--tinta); font:15px/1.4 -apple-system,system-ui,sans-serif }
  header { padding:12px 16px; border-bottom:2px solid var(--tinta); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap }
  h1 { font-size:18px; margin:0 } #quando { color:var(--suave); font-size:13px } #texto { padding:10px 16px; font-size:16px }
  main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:12px; padding:0 16px 16px }
  @media (max-width: 800px) { main { grid-template-columns: 1fr } }
  #palco { height:62vh; min-height:320px; background:#e9dfca; border:2px solid var(--tinta); position:relative }
  #palco small { position:absolute; left:8px; bottom:6px; color:var(--suave) }
  #imagens { display:flex; flex-direction:column; gap:10px; max-height:80vh; overflow:auto }
  figure { margin:0; border:2px solid var(--tinta); background:#fff } figure img { width:100%; display:block } figcaption { padding:4px 8px; font-size:13px; color:var(--suave) }
</style></head>
<body>
<header><h1>Maresia: ateliê do personagem</h1><span id="quando"></span></header>
<div id="texto">aguardando…</div>
<main>
  <div id="palco"><small id="nomeglb">arraste para girar, roda para zoom</small></div>
  <div id="imagens"></div>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
const palco = document.getElementById('palco')
const render = new THREE.WebGLRenderer({ antialias: true }); palco.appendChild(render.domElement)
const cena = new THREE.Scene(); cena.background = new THREE.Color('#e9dfca')
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 50); cam.position.set(0, 0.1, 2.6)
const ctl = new OrbitControls(cam, render.domElement); ctl.target.set(0, 0, 0)
cena.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 1.6)); const sol = new THREE.DirectionalLight(0xffffff, 1.4); sol.position.set(1, 2, 2); cena.add(sol)
let modelo = null, glbAtual = '', estadoAtual = ''
function tamanho() { const w = palco.clientWidth, h = palco.clientHeight; render.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix() }
addEventListener('resize', tamanho); tamanho()
;(function laco() { requestAnimationFrame(laco); ctl.update(); render.render(cena, cam) })()
async function atualizar() {
  try {
    const r = await fetch('estado.json?t=' + Date.now()); const e = await r.json(); const chave = JSON.stringify(e)
    if (chave === estadoAtual) return; estadoAtual = chave
    document.getElementById('texto').textContent = e.texto || ''
    document.getElementById('quando').textContent = e.atualizado ? 'atualizado ' + e.atualizado : ''
    document.getElementById('imagens').innerHTML = (e.imagens || []).map(i =>
      `<figure><img src="../${i.arquivo}?t=${e.atualizado}" alt=""><figcaption>${i.legenda || i.arquivo}</figcaption></figure>`).join('')
    const glb = e.glb ? e.glb + '?t=' + e.atualizado : ''
    if (glb && glb !== glbAtual) {
      glbAtual = glb
      new GLTFLoader().load('../' + glb, g => {
        if (modelo) cena.remove(modelo); modelo = g.scene
        const caixa = new THREE.Box3().setFromObject(modelo); const c = caixa.getCenter(new THREE.Vector3())
        modelo.position.sub(c); cena.add(modelo); document.getElementById('nomeglb').textContent = e.glb + ' · arraste para girar'
      })
    }
  } catch (err) { /* estado ainda não existe */ }
}
atualizar(); setInterval(atualizar, 2000)
</script>
</body></html>
