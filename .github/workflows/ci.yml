# CI de verificação (sem deploy; o deploy no Pages é o pages.yml). Só ci-ok conta para merge.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  testes-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
  regressao:
    # commit fix: sem arquivo de teste alterado no PR = vermelho (docs/PADRAO.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: fix exige teste
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          FIX=$(git log --format=%s "$BASE"..HEAD | grep -E '^fix(\(.+\))?!?:' || true)
          [ -z "$FIX" ] && { echo "sem commits fix:"; exit 0; }
          TESTES=$(git diff --name-only "$BASE"...HEAD | grep -E '(__tests__/|\.test\.|\.spec\.|^tests?/|^testes/|/test_[^/]*\.py$)' || true)
          [ -n "$TESTES" ] || { echo "::error::commit fix: sem teste de regressão"; echo "$FIX"; exit 1; }
          echo "ok: $TESTES"
  ci-ok:
    if: always()
    needs: [testes-build, regressao]
    runs-on: ubuntu-latest
    steps:
      - name: todos verdes (skipped só vale para regressao fora de PR)
        env: { R: "${{ toJSON(needs) }}" }
        run: |
          echo "$R" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' \
            || { echo "$R" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }
